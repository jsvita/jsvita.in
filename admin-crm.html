<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/jsvita-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="JSVita CRM — private business operations." />
  <title>CRM — JSVita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    :root{--bg:#050505;--bg2:#0B0B0B;--gold:#D4AF37;--prem:#F7D774;--deep:#b8860b;--cream:#fff;--muted:#B8B8B8;--border:rgba(212,175,55,.25);--ease:cubic-bezier(.4,0,.2,1)}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%}
    body{background:radial-gradient(800px 520px at 80% -5%,rgba(212,175,55,.10),transparent 60%),radial-gradient(620px 460px at 0% 100%,rgba(184,134,11,.08),transparent 55%),linear-gradient(180deg,#050505,#0B0B0B 55%,#050505);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif}
    ::selection{background:rgba(212,175,55,.35)}
    ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#050505}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(212,175,55,.5),rgba(184,134,11,.3));border-radius:8px}
    a{color:var(--prem)}
    header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(5,5,5,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
    header .jv-logo{width:38px;height:38px;filter:drop-shadow(0 2px 10px rgba(212,175,55,.4))}
    header .bsub{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.34em;color:var(--gold)}
    header .bname{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}
    header .spacer{flex:1}
    header .who{font-size:12px;color:var(--muted)}
    .pill{font-size:12.5px;color:#e8d9ae;text-decoration:none;border:1px solid rgba(212,175,55,.3);padding:8px 16px;border-radius:999px;transition:.25s;background:none;cursor:pointer;font-family:inherit}
    .pill:hover{border-color:rgba(212,175,55,.7);color:var(--prem)}
    .shell{display:grid;grid-template-columns:216px 1fr;min-height:calc(100vh - 63px)}
    nav.side{border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:63px;height:calc(100vh - 63px);overflow:auto}
    nav.side .navk{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.3em;color:var(--deep);text-transform:uppercase;padding:10px 12px 6px}
    nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:500 13.5px 'DM Sans',sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s}
    nav.side button:hover{color:var(--cream);background:rgba(212,175,55,.07)}
    nav.side button.on{color:var(--prem);background:rgba(212,175,55,.12);box-shadow:inset 2px 0 0 var(--gold)}
    nav.side button .ic{width:18px;text-align:center;opacity:.9}
    nav.side button .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);background:rgba(212,175,55,.12);border:1px solid var(--border);padding:1px 7px;border-radius:999px}
    main{padding:26px 30px 60px;min-width:0}
    .h{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;margin-bottom:4px}
    .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
    .kpi{border:1px solid var(--border);border-radius:14px;padding:16px;background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(11,11,11,.6))}
    .kpi .n{font:800 26px/1.1 'Playfair Display',serif;color:var(--prem)}
    .kpi .l{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
    .panel{border:1px solid var(--border);border-radius:16px;background:rgba(11,11,11,.55);padding:20px;margin-bottom:22px}
    .panel h3{font-size:15px;margin-bottom:12px;color:var(--prem)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
    td{padding:10px;border-bottom:1px solid rgba(212,175,55,.1);color:#D8CCBE;vertical-align:top}
    tr:hover td{background:rgba(212,175,55,.04)}
    .st{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
    .st-new{color:#F7D774;background:rgba(212,175,55,.12)}
    .st-contacted,.st-proposal,.st-negotiation{color:#e8d9ae}
    .st-won,.st-project-active,.st-completed{color:#7ee2a8;border-color:rgba(126,226,168,.35)}
    .st-lost{color:#f08c8c;border-color:rgba(240,140,140,.35)}
    .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,#F3E5AB,#D4AF37);color:#17110C;font:700 12.5px 'DM Sans',sans-serif;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;transition:.2s}
    .btn:hover{transform:translateY(-1px)}
    .btn.ghost{background:none;border:1px solid rgba(212,175,55,.45);color:var(--prem)}
    .btn.sm{padding:7px 13px;font-size:11.5px}
    .inp,select,textarea{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:10px;color:var(--cream);font:400 13.5px 'DM Sans',sans-serif;padding:10px 12px;outline:none;transition:border-color .2s}
    .inp:focus,select:focus,textarea:focus{border-color:var(--gold)}
    textarea{min-height:74px;resize:vertical}
    label.f{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
    .frow{display:grid;gap:12px}
    @media(min-width:720px){.frow.c2{grid-template-columns:1fr 1fr}.frow.c3{grid-template-columns:1fr 1fr 1fr}}
    .empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13.5px}
    .empty b{color:var(--prem)}
    .pipe{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .pipe .col{border:1px solid var(--border);border-radius:12px;padding:10px;background:rgba(0,0,0,.35);min-height:80px}
    .pipe .col h4{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    .pipe .lead{border:1px solid rgba(212,175,55,.2);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px;color:#D8CCBE;cursor:pointer}
    .pipe .lead:hover{border-color:var(--gold)}
    .pipe .lead b{display:block;color:var(--cream);font-weight:600;font-size:12.5px}
    .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);overflow:auto;padding:40px 16px}
    .modal.open{display:flex}
    .mbox{width:min(680px,100%);background:linear-gradient(170deg,#0d0c09,#070605);border:1px solid var(--border);border-radius:18px;padding:24px}
    .mbox h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--prem);margin-bottom:4px}
    .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
    .notes{margin-top:10px}
    .notes .note{border-left:2px solid var(--gold);padding:6px 10px;margin-bottom:8px;font-size:12.5px;color:#D8CCBE;background:rgba(212,175,55,.05);border-radius:0 8px 8px 0}
    .notes .note span{display:block;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--deep);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
    .gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    .gate .jv-logo{width:84px;height:84px;filter:drop-shadow(0 8px 24px rgba(212,175,55,.5))}
    .gate h1{font-family:'Playfair Display',serif;font-size:24px}
    .gate p{color:var(--muted);font-size:13.5px}
    .msg{min-height:20px;color:var(--gold);font-size:13px}
    .drawer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .toolrow .inp{width:auto;min-width:220px;flex:1 1 220px}
    .mono{font-family:'JetBrains Mono',monospace}
    .dim{color:var(--muted)}
    footer.pagefoot{padding:18px 30px;border-top:1px solid var(--border);color:#776a55;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
    @media(max-width:860px){.shell{grid-template-columns:1fr}nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--border)}nav.side .navk{display:none}nav.side button{width:auto}}
  </style>

</head>
<body>
  <header>
    <a class="bname" href="/"><svg class="jv-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g transform="translate(120,120)"><polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0A0A0C" stroke="url(#jvCrmG)" stroke-width="4"/><polygon points="0,-95 83,-46 83,46 0,95 -83,46 -83,-46" fill="none" stroke="url(#jvCrmG)" stroke-width="1.4" opacity="0.55"/><path d="M -15,-45 L -15,25 C -15,45 0,55 25,45 C 40,38 48,22 48,22" fill="none" stroke="url(#jvCrmG)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28,-38 C 15,-48 -15,-42 -22,-25 C -28,-10 18,-2 12,20 C 6,38 -22,42 -35,30" fill="none" stroke="url(#jvCrmG)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -50,-20 L 0,65 L 50,-20" fill="none" stroke="url(#jvCrmL)" stroke-width="3" opacity="0.4"/></g></svg><span><span class="bname" style="font-size:15px">JSVita</span><span class="bsub">CRM · OPERATIONS</span></span></a>

  <div class="gate" id="gate">
    <svg class="jv-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g transform="translate(120,120)"><polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0A0A0C" stroke="url(#jvCrmG)" stroke-width="4"/><path d="M -15,-45 L -15,25 C -15,45 0,55 25,45 C 40,38 48,22 48,22" fill="none" stroke="url(#jvCrmG)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28,-38 C 15,-48 -15,-42 -22,-25 C -28,-10 18,-2 12,20 C 6,38 -22,42 -35,30" fill="none" stroke="url(#jvCrmG)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
    <h1>JSVita CRM</h1>
    <p>Verifying your access…</p>
    <div class="msg" id="gateMsg" role="status" aria-live="polite"></div>
  </div>

  <div class="shell" id="shell" style="display:none">
    <nav class="side" aria-label="CRM modules">
      <span class="navk">Operations</span>
      <button data-mod="dashboard" class="on"><span class="ic">◈</span>Dashboard</button>
      <button data-mod="leads"><span class="ic">✉</span>Leads<span class="cnt" id="cntLeads">0</span></button>
      <button data-mod="projects"><span class="ic">▤</span>Projects<span class="cnt" id="cntProjects">0</span></button>
      <button data-mod="clients"><span class="ic">◍</span>Clients<span class="cnt" id="cntClients">0</span></button>
      <button data-mod="payments"><span class="ic">₹</span>Payments<span class="cnt" id="cntPayments">0</span></button>
      <button data-mod="bookings"><span class="ic">◷</span>Bookings<span class="cnt" id="cntBookings">0</span></button>
      <span class="navk">Insight</span>
      <button data-mod="analytics"><span class="ic">◱</span>Analytics</button>
      <button data-mod="settings"><span class="ic">⚙</span>Settings</button>
      <span class="navk">Tools</span>
      <button data-mod="proposals"><span class="ic">✎</span>Proposals</button>
      <button data-mod="onboarding"><span class="ic">→</span>Onboarding</button>
    </nav>
    <main id="main"></main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mbox" id="mBox"></div>

  <footer class="pagefoot">JSVITA CRM · PRIVATE · NOINDEX</footer>

  <script>
    /* ================= JSVITA CRM — local-first operations core =================
       Storage: localStorage (jsvita_crm_v1) with JSON export/import for backup.
       Upgrade path (documented in OPERATIONS.md): set window.JSVITA_CRM_ENDPOINT
       or wire Firebase Firestore — the record schema is already canonical. */
    firebase.initializeApp({ apiKey:"AIzaSyAoEGzAL-WkAGttLArl_PpffJYbOYwc5yE", authDomain:"auth.jsvita.in",
      projectId:"jsvita-login", storageBucket:"jsvita-login.firebasestorage.app",
      messagingSenderId:"433927112110", appId:"1:433927112110:web:ad6186be9800780e8d343f" });
    const OWNER = "admin@jsvita.in";
    const LSKEY = "jsvita_crm_v1";
    const STATUSES = ["New Lead","Contacted","Proposal Sent","Negotiation","Won","Lost","Project Active","Completed"];
    const STCL = {"New Lead":"st-new","Contacted":"st-contacted","Proposal Sent":"st-proposal","Negotiation":"st-negotiation","Won":"st-won","Lost":"st-lost","Project Active":"st-project-active","Completed":"st-completed"};
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN");
    const fdate = iso => iso ? new Date(iso).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }) : "—";

    function blankDB(){ return { leads:[], projects:[], clients:[], payments:[], bookings:[] }; }
    function load(){ try { const r = localStorage.getItem(LSKEY); if (r) { const d = JSON.parse(r); return Object.assign(blankDB(), d); } } catch(e){} return blankDB(); }
    function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(DB)); } catch(e){} refreshCounts(); }
    let DB = load();

    /* ---------- sample data (Settings → clearly labelled, never auto-loaded) ---------- */
    function sampleData(){
      const d = blankDB(); const t = new Date(); const day = n => new Date(t.getTime() - n*864e5).toISOString();
      d.leads = [
        { id:uid(), name:"Ravi Kumar", phone:"+91 98765 43210", email:"ravi@example.com", company:"Kumar Textiles", service:"Business Website", source:"contact", status:"New Lead", created:day(0), notes:[{at:day(0), txt:"Sample lead — from contact form."}] },
        { id:uid(), name:"Priya Nair", phone:"+91 90123 45678", email:"priya@example.com", company:"Nair Interiors", service:"Website Redesign", source:"meta-ads", status:"Proposal Sent", created:day(3), notes:[{at:day(2), txt:"Sample — proposal ₹7,999 sent."}] },
        { id:uid(), name:"Arun Patel", phone:"+91 91234 56789", email:"arun@patelco.example", company:"Patel & Co.", service:"Landing Page", source:"contact", status:"Project Active", created:day(12), notes:[{at:day(10), txt:"Sample — advance received, project started."}] }
      ];
      d.clients = [{ id:uid(), name:"Arun Patel", company:"Patel & Co.", email:"arun@patelco.example", phone:"+91 91234 56789" }];
      d.projects = [{ id:uid(), name:"Patel & Co. — Consultation Funnel", client:"Arun Patel", company:"Patel & Co.", service:"Landing Page", value:4998, status:"In Progress", created:day(10), timeline:"2-week delivery", checklist:{ welcome:true, requirements:true, brand:false, domain:false, hosting:false } }];
      d.payments = [
        { id:uid(), project:"Patel & Co. — Consultation Funnel", client:"Arun Patel", milestone:"50% Advance", amount:2499, status:"Paid", due:day(10), paid:day(10) },
        { id:uid(), project:"Patel & Co. — Consultation Funnel", client:"Arun Patel", milestone:"50% Before Launch", amount:2499, status:"Pending", due:"", paid:"" }
      ];
      d.bookings = [{ id:uid(), date:new Date(t.getTime()+2*864e5).toISOString(), name:"Priya Nair", type:"Consultation", source:"Calendly", status:"Confirmed" }];
      return d;
    }

    /* ---------- modal ---------- */
    const modal = document.getElementById("modal"), mBox = document.getElementById("mBox");
    function openModal(html){ mBox.innerHTML = html; modal.classList.add("open"); }
    function closeModal(){ modal.classList.remove("open"); }
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

    /* ---------- helpers ---------- */
    function leadById(id){ return DB.leads.find(l => l.id === id); }
    function statusChip(s){ return '<span class="st ' + (STCL[s]||"") + '">' + esc(s) + '</span>'; }
    function statusSelect(id, cur){
      return '<select data-leadst="' + id + '">' + STATUSES.map(s => '<option' + (s===cur?' selected':'') + '>' + s + '</option>').join("") + '</select>';
    }
    function refreshCounts(){
      const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n; };
      set("cntLeads", DB.leads.length); set("cntProjects", DB.projects.length);
      set("cntClients", DB.clients.length); set("cntPayments", DB.payments.length); set("cntBookings", DB.bookings.length);
    }
    function waLink(phone, name){
      const digits = String(phone||"").replace(/[^0-9]/g,"");
      const txt = encodeURIComponent("Hi " + (name||"") + " — JSVita here regarding your project enquiry.");
      return digits ? "https://wa.me/" + digits + "?text=" + txt : "";
    }

    /* ================= modules ================= */
    const R = {};

    R.dashboard = function(){
      const total = DB.leads.length;
      const byStatus = {}; STATUSES.forEach(s => byStatus[s] = DB.leads.filter(l => l.status === s).length);
      const won = byStatus["Won"] + byStatus["Project Active"] + byStatus["Completed"];
      const lost = byStatus["Lost"];
      const conv = (won + lost) ? Math.round(won * 100 / (won + lost)) : 0;
      const collected = DB.payments.filter(p => p.status === "Paid").reduce((a, p) => a + Number(p.amount||0), 0);
      const outstanding = DB.payments.filter(p => p.status !== "Paid").reduce((a, p) => a + Number(p.amount||0), 0);
      const pipeline = STATUSES.map(s =>
        '<div class="col"><h4>' + esc(s) + ' · ' + byStatus[s] + '</h4>' +
        DB.leads.filter(l => l.status === s).map(l => '<div class="lead" data-open-lead="' + l.id + '"><b>' + esc(l.name) + '</b>' + esc(l.company || l.service || "") + '</div>').join("") + '</div>').join("");
      return '<h1 class="h">Dashboard</h1><p class="sub">Business pulse — leads, pipeline and money.</p>' +
        '<div class="kpis">' +
          kpi(total, "Total Leads") + kpi(byStatus["New Lead"], "New Leads") + kpi(DB.projects.filter(p=>p.status!=="Completed").length, "Active Projects") +
          kpi(inr(collected), "Collected") + kpi(inr(outstanding), "Outstanding") + kpi(conv + "%", "Lead → Win Rate") +
        '</div>' +
        '<div class="panel"><h3>Pipeline — ' + total + ' leads</h3><div class="pipe">' + pipeline + '</div></div>' +
        activityPanel();
    };
    function kpi(n, l){ return '<div class="kpi"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    function activityPanel(){
      const items = [];
      DB.leads.forEach(l => (l.notes||[]).forEach(n => items.push({ at:n.at, txt:'<b>' + esc(l.name) + '</b> — ' + esc(n.txt) })));
      items.sort((a,b) => new Date(b.at) - new Date(a.at));
      return '<div class="panel"><h3>Recent activity</h3>' + (items.length ? '<div class="notes">' + items.slice(0,8).map(i => '<div class="note"><span>' + fdate(i.at) + '</span>' + i.txt + '</div>').join("") + '</div>' : '<div class="empty">No activity yet — notes you add on leads appear here.</div>') + '</div>';
    }

    R.leads = function(){
      return '<h1 class="h">Leads</h1><p class="sub">Every enquiry — track status, keep notes, move the pipeline.</p>' +
        '<div class="toolrow"><input class="inp" id="leadQ" placeholder="Search name, company, email…">' +
        '<select id="leadF" style="width:auto"><option value="">All statuses</option>' + STATUSES.map(s => '<option>' + s + '</option>').join("") + '</select>' +
        '<button class="btn" id="leadAdd">+ New Lead</button></div>' +
        '<div class="panel" style="overflow:auto"><table><thead><tr><th>Name</th><th>Company</th><th>Service</th><th>Source</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="leadRows"></tbody></table></div>';
    };
    function renderLeadRows(){
      const q = (document.getElementById("leadQ")||{}).value ? document.getElementById("leadQ").value.toLowerCase() : "";
      const f = (document.getElementById("leadF")||{}).value || "";
      const rows = DB.leads

    /* Lead → Client → Project + 50/50 payments (onboarding automation, step 1) */
    function convertLead(l){
      const company = l.company || l.name;
      if (!DB.clients.some(c => c.email && c.email === l.email && l.email)) DB.clients.push({ id:uid(), name:l.name, company:company, email:l.email, phone:l.phone });
      const value = Number(prompt("Project value (₹) — from the signed proposal:", "4999")) || 0;
      const p = { id:uid(), name:company + " — " + (l.service || "Project"), client:l.name, company:company, service:l.service || "", value:value,
        status:"Planning", created:new Date().toISOString(), timeline:"", checklist:{ welcome:false, requirements:false, brand:false, domain:false, hosting:false } };
      DB.projects.push(p);
      if (value > 0) {
        DB.payments.push({ id:uid(), project:p.name, client:l.name, milestone:"50% Advance", amount:Math.round(value/2), status:"Pending", due:"", paid:"" });
        DB.payments.push({ id:uid(), project:p.name, client:l.name, milestone:"50% Before Launch", amount:Math.round(value/2), status:"Pending", due:"", paid:"" });
      }
      l.status = "Project Active"; l.notes = l.notes || []; l.notes.push({ at:new Date().toISOString(), txt:"Converted to client — project created, 50/50 payments scheduled." });
      save(); renderLeadRows(); closeModal(); go("projects");
    }

    /* ================= router + events ================= */
    let CUR = "dashboard";
    function go(mod){
      CUR = mod;
      document.querySelectorAll("nav.side button").forEach(b => b.classList.toggle("on", b.getAttribute("data-mod") === mod));
      const m = document.getElementById("main"); m.innerHTML = (R[mod] || R.dashboard)();
      if (mod === "leads") { renderLeadRows();
        document.getElementById("leadAdd").onclick = leadForm;
        document.getElementById("leadQ").oninput = renderLeadRows;
        document.getElementById("leadF").onchange = renderLeadRows; }
      if (mod === "projects") renderProjRows();
      if (mod === "bookings") { renderBkRows(); document.getElementById("bkAdd").onclick = bkForm; }
      m.scrollTop = 0; window.scrollTo({ top:0 });
    }
    document.addEventListener("click", function(e){
      const t = e.target;
      const nav = t.closest ? t.closest("[data-mod]") : null; if (nav) { go(nav.getAttribute("data-mod")); return; }
      const ol = t.closest ? t.closest("[data-open-lead]") : null; if (ol) { e.preventDefault(); leadDrawer(ol.getAttribute("data-open-lead")); return; }
      const op = t.closest ? t.closest("[data-open-proj]") : null; if (op) { e.preventDefault(); projDrawer(op.getAttribute("data-open-proj")); return; }
    });
    document.addEventListener("change", function(e){
      const t = e.target;
      if (t.matches("[data-leadst]")) { const l = leadById(t.getAttribute("data-leadst")); if (l) { l.status = t.value; save(); if (CUR === "dashboard") go("dashboard"); } }
      if (t.matches("[data-projst]")) { const p = DB.projects.find(x => x.id === t.getAttribute("data-projst")); if (p) { p.status = t.value; save(); } }
      if (t.matches("[data-payst]")) { const p = DB.payments.find(x => x.id === t.getAttribute("data-payst")); if (p) { p.status = t.value; if (t.value === "Paid") p.paid = new Date().toISOString(); save(); go("payments"); } }
      if (t.matches("[data-bkst]")) { const b = DB.bookings.find(x => x.id === t.getAttribute("data-bkst")); if (b) { b.status = t.value; save(); } }
    });
    document.addEventListener("click", function(e){
      if (e.target.id === "s_export") {
        const blob = new Blob([JSON.stringify(DB, null, 2)], { type:"application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "jsvita-crm-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
      }
      if (e.target.id === "s_sample") { if (confirm("Load sample data? It replaces current CRM content — export first if needed.")) { DB = sampleData(); save(); go("dashboard"); } }
      if (e.target.id === "s_clear") { if (confirm("Clear ALL CRM data? Export first — this cannot be undone.")) { DB = blankDB(); save(); go("dashboard"); } }
    });
    document.addEventListener("change", function(e){
      if (e.target.id === "s_import") {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = function(){ try { DB = Object.assign(blankDB(), JSON.parse(r.result)); save(); go("dashboard"); } catch(err) { alert("Invalid backup file."); } };
        r.readAsText(f);
      }
    });

    /* auth gate */
    firebase.auth().onAuthStateChanged(function(u){
      if (u && (u.email || "").toLowerCase() === OWNER) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("shell").style.display = "grid";
        document.getElementById("who").textContent = u.email;
        document.getElementById("signout").style.display = "inline-flex";
        document.getElementById("signout").onclick = function(){ firebase.auth().signOut().then(function(){ location.href = "/login.html"; }); };
        refreshCounts(); go("dashboard");
      } else {
        document.getElementById("gateMsg").textContent = u ? "This account does not have admin access." : "Not signed in.";
        setTimeout(function(){ location.href = "/login.html"; }, 1200);
      }
    });
  </script>
</body>
</html>
